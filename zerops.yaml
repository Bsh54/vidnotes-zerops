zerops:
  - setup: app
    build:
      base: python@3.12
      os: ubuntu
      prepareCommands:
        - python3 -m pip install --upgrade pip
      buildCommands:
        - python3 -m pip install -r requirements.txt
      deployFiles:
        - app.py
        - worker.py
        - analytics.py
        - guard.py
        - store.py
        - static/
        - requirements.txt
      addToRunPrepare:
        - requirements.txt
      cache:
        - /root/.cache/pip

    run:
      base: python@3.12
      os: ubuntu
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y ffmpeg nodejs wget ca-certificates fonts-liberation
        - wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
        - sudo apt-get install -y /tmp/chrome.deb && rm -f /tmp/chrome.deb
        - python3 -m pip install --ignore-installed -r requirements.txt
      envVariables:
        VIDNOTES_CHROME: /usr/bin/google-chrome
        GROQ_STT_MODEL: whisper-large-v3-turbo
        GEMINI_MODEL: gemini-flash-lite-latest
        VIDNOTES_LOCAL_WHISPER: "1"
        OREUS_WHISPER_MODEL: base
        PGHOST: ${db_hostname}
        PGPORT: ${db_port}
        PGUSER: ${db_user}
        PGPASSWORD: ${db_password}
        PGDATABASE: ${db_dbName}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
      ports:
        - port: 8000
          httpSupport: true
      start: gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 8 --timeout 1800 app:app
      healthCheck:
        httpGet:
          port: 8000
          path: /health
